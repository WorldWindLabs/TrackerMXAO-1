<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <title>Rastreador del satélite MXÁO-1</title>
    <link href="style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  </head>
  <body>
    <div class="container">
      <header style="z-index:1 !important;">
        <div class="ghost-box">
          <h1>Rastreador del satélite MXÁO-1</h1>
          <p>Latitud: <span id="latitude"></span> | Longitud: <span id="longitude"></span> | Altitud: <span id="altitude"></span></p>
          <p><a href="javascript:openHelp();">Ayuda</a> | Representación: <a href="javascript:toggleRepresentation();" id="representation">3D</a> | Seguir: <a href="javascript:toggleFollow();" id="follow">Off</a></p>
        </div>
      </header>
      <canvas id="wwd" class="balloon align-self-center">
              Your browser does not support HTML5 Canvas.
      </canvas>
      <footer>
          <p class="ghost-box">Construido con <a href="https://worldwind.arc.nasa.gov/web/">Web WorldWind</a>, <a href="https://github.com/shashwatak/satellite-js">Satellite.js</a> e íconos hechos por <a href="http://www.flaticon.com/authors/freepik" title="Freepik">Freepik</a> de <a href="http://www.flaticon.com" title="Flaticon">www.flaticon.com</a>.</p>
      </footer>
    </div>
    <script src="libraries/worldwind.js"></script>
    <script src="libraries/satellite.js"></script>
    <script src="app.js"></script>

  </body>
</html>
